sentence=On-device intelligence for ESP32: built-in hardware model, swappable TOON knowledge models, and a WebAssembly runtime with a chat-style web UI.
paragraph=AURA answers natural prompts from two layers: an irreplaceable primary model compiled into firmware (greetings plus GPIO/ADC/PWM/I2C sensor and actuator control, English and Indonesian) and swappable TOON knowledge packs stored in LittleFS with a confidence threshold that declines out-of-domain questions. Models install from the built-in web page, from a URL, or via the PlatformIO data folder. A wasm3 runtime executes portable WebAssembly modules on-chip. Requires an ESP32-class device (ESP32-S3 recommended); small AVR boards are not supported.
